<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EduWorld Test Runner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; color: #0f172a; padding: 20px; }
    .container { max-width: 650px; margin: 0 auto; background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .title { font-size: 1.8rem; font-weight: 700; color: #2563eb; text-align: center; margin-bottom: 16px; }
    .test-card { display: flex; justify-content: space-between; align-items: center; padding: 14px; background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; }
    .btn { background: #2563eb; color: #fff; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .question-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .q-title { font-weight: 600; margin-bottom: 10px; font-size: 1.05rem; }
    .opt-label { display: flex; align-items: center; gap: 8px; padding: 8px; background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
    .hidden { display: none; }
    .error-msg { color: #dc2626; background: #fef2f2; border: 1px solid #fecaca; padding: 10px; border-radius: 6px; margin-bottom: 12px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <div class="title">&#9819; EduWORLD</div>

    <!-- ERROR WARNING BOX -->
    <div id="error-alert" class="error-msg"></div>

    <!-- VIEW 1: FILE MENU -->
    <div id="menu-view">
      <h3 style="margin-bottom: 12px;">Available Tests:</h3>
      <div id="file-list">Loading tests...</div>
    </div>

    <!-- VIEW 2: TEST RUNNER -->
    <div id="runner-view" class="hidden">
      <h2 id="test-header" style="margin-bottom: 16px;"></h2>
      <form id="quiz-form">
        <div id="questions-list"></div>
        <button type="button" class="btn" style="width: 100%; margin-top: 10px;" onclick="submitQuiz()">Submit Test</button>
      </form>
    </div>

    <!-- VIEW 3: RESULTS -->
    <div id="results-view" class="hidden" style="text-align: center;">
      <h2>Test Complete!</h2>
      <div id="score-text" style="font-size: 3rem; font-weight: bold; color: #2563eb; margin: 20px 0;"></div>
      <button class="btn" onclick="backToMenu()">Back to Menu</button>
    </div>
  </div>

  <script>
    const OWNER = "Mistyitz";
    const REPO = "EduForgePlatform-";
    const FOLDER = "Test";
    
    let files = [];
    let currentQuizData = null;

    // Fetch File List
    async function init() {
      try {
        const res = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`);
        
        if (!res.ok) throw new Error(`Could not access /${FOLDER}`);
        
        files = await res.json();
        const testFiles = files.filter(f => f.type === "file");

        const listContainer = document.getElementById('file-list');
        listContainer.innerHTML = "";

        if (testFiles.length === 0) {
          listContainer.innerHTML = "<p>No files found inside /Test folder.</p>";
          return;
        }

        testFiles.forEach((file, idx) => {
          const div = document.createElement('div');
          div.className = "test-card";
          div.innerHTML = `
            <div><strong>${file.name}</strong></div>
            <button class="btn" onclick="runTest(${idx})">Start</button>
          `;
          listContainer.appendChild(div);
        });

      } catch (e) {
        showError("Failed to load tests: " + e.message);
      }
    }

    // Fetch and Parse Selected Test
    async function runTest(index) {
      document.getElementById('error-alert').style.display = 'none';
      const file = files[index];

      try {
        const res = await fetch(file.download_url);
        if (!res.ok) throw new Error("Failed to download file contents.");

        const rawText = await res.text();
        const quiz = parseTestFormat(rawText);

        if (!quiz || quiz.questions.length === 0) {
          throw new Error("Could not parse questions from file. Check text formatting.");
        }

        currentQuizData = quiz;
        renderQuiz(quiz);

      } catch (e) {
        showError("Failed to start test: " + e.message);
      }
    }

    // Parser Logic
    function parseTestFormat(text) {
      const titleMatch = text.match(/<([^>]+)>/);
      const title = titleMatch ? titleMatch[1].trim() : "Test";

      const questions = [];
      const qBlocks = text.split(/<Q\d+/i);

      for (let i = 1; i < qBlocks.length; i++) {
        const block = qBlocks[i];

        const qTitleMatch = block.match(/\{([^}]+)\}/);
        if (!qTitleMatch) continue;

        const qTitle = qTitleMatch[1].trim();
        const lines = block.split(/\r?\n/);
        const options = [];
        let correctKey = null;

        lines.forEach(line => {
          const optMatch = line.match(/\(([a-z])\)\s*([^(\n\r]+)/i);
          if (optMatch) {
            const key = optMatch[1].toLowerCase();
            let optText = optMatch[2].trim();

            optText = optText.replace(/<|>$/g, "").trim();

            if (line.includes("(c)")) {
              optText = optText.replace(/\(c\)/gi, "").trim();
              correctKey = key;
            }

            options.push({ key: key, text: optText });
          }
        });

        if (options.length > 0) {
          questions.push({
            title: qTitle,
            options: options,
            correct: correctKey || options[0].key
          });
        }
      }

      return { title, questions };
    }

    // Render Quiz
    function renderQuiz(quiz) {
      document.getElementById('test-header').innerText = quiz.title;
      const qList = document.getElementById('questions-list');
      qList.innerHTML = "";

      quiz.questions.forEach((q, qIdx) => {
        const div = document.createElement('div');
        div.className = "question-card";
        div.id = `q-card-${qIdx}`;

        let optsHTML = q.options.map(opt => `
          <label class="opt-label">
            <input type="radio" name="q_${qIdx}" value="${opt.key}">
            (${opt.key}) ${opt.text}
          </label>
        `).join('');

        div.innerHTML = `
          <div class="q-title">Q${qIdx + 1}: ${q.title}</div>
          ${optsHTML}
        `;
        qList.appendChild(div);
      });

      document.getElementById('menu-view').classList.add('hidden');
      document.getElementById('runner-view').classList.remove('hidden');
    }

    // Submit & Check Completion
    function submitQuiz() {
      let missing = [];
      let correctCount = 0;

      currentQuizData.questions.forEach((q, qIdx) => {
        const selected = document.querySelector(`input[name="q_${qIdx}"]:checked`);
        const card = document.getElementById(`q-card-${qIdx}`);

        if (!selected) {
          missing.push(qIdx + 1);
          card.style.border = "2px solid #ef4444";
        } else {
          card.style.border = "1px solid #e2e8f0";
          if (selected.value === q.correct) {
            correctCount++;
          }
        }
      });

      if (missing.length > 0) {
        showError(`Please answer all questions before submitting! Unanswered: Q${missing.join(', Q')}`);
        return;
      }

      const pct = Math.round((correctCount / currentQuizData.questions.length) * 100);
      document.getElementById('score-text').innerText = `${pct}% (${correctCount}/${currentQuizData.questions.length})`;
      
      document.getElementById('runner-view').classList.add('hidden');
      document.getElementById('results-view').classList.remove('hidden');
    }

    function showError(msg) {
      const errBox = document.getElementById('error-alert');
      errBox.innerText = msg;
      errBox.style.display = 'block';
    }

    function backToMenu() {
      document.getElementById('results-view').classList.add('hidden');
      document.getElementById('menu-view').classList.remove('hidden');
      document.getElementById('error-alert').style.display = 'none';
    }

    init();
  </script>
</body>
</html>
