<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Test Launcher</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      text-align: center;
    }
    .container {
      display: flex;
      gap: 16px;
      margin-top: 20px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: #2563eb;
      color: #ffffff;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 500;
    }
    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Select Your Assessment Launcher</h2>
    <div class="container">
      <a class="btn" href="https://cdn.jsdelivr.net/gh/Mistyitz/EduForgePlatform-@main/ME.svg">Secure Test Taker</a>
      <a class="btn" href="https://cdn.jsdelivr.net/gh/Mistyitz/EduForgePlatform-@main/SupL.svg">Main Launcher</a>
    </div>
  </div>
</body>
</html>
