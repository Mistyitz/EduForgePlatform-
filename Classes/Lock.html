<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduWorld - SVG Launcher</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    #svg-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .status-box {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      padding: 24px 32px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      text-align: center;
      color: #0f172a;
    }
    .error {
      color: #dc2626;
      border-color: #fecaca;
      background: #fef2f2;
    }
  </style>
</head>
<body>

  <div id="svg-container">
    <div id="status" class="status-box">Loading SVG application...</div>
  </div>

  <script>
    // Converted your GitHub URL to its raw content endpoint
    const RAW_SVG_URL = "https://raw.githubusercontent.com/Mistyitz/EduForgePlatform-/main/ME.svg";

    async function loadAndExecuteSVG() {
      const container = document.getElementById('svg-container');
      const status = document.getElementById('status');

      try {
        const response = await fetch(RAW_SVG_URL);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: Failed to fetch ME.svg`);
        }

        const svgContent = await response.text();

        // Inject SVG directly into DOM
        container.innerHTML = svgContent;

        // Execute any inline <script> blocks inside the fetched SVG
        const scripts = container.querySelectorAll('script');
        scripts.forEach(oldScript => {
          const newScript = document.createElement('script');
          Array.from(oldScript.attributes).forEach(attr => {
            newScript.setAttribute(attr.name, attr.value);
          });
          newScript.textContent = oldScript.textContent;
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });

      } catch (err) {
        status.innerText = "Error loading SVG file: " + err.message;
        status.classList.add('error');
      }
    }

    loadAndExecuteSVG();
  </script>
</body>
</html>
