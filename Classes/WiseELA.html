
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Presentation Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden; /* Prevents scrollbars */
            background-color: transparent;
        }

        iframe {
            width: 100vw;
            height: 100vh;
            border: 0;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://docs.google.com/presentation/d/e/2PACX-1vS2O0slKirNqnrrlyyLimxlhhNW3MjOq66KQzzyeKuSbzDaRSnGaqln9oR1OVqhodFfMO8GlRCYD_Zl/embed?start=false&loop=false&delayms=3000" 
        allowfullscreen="true" 
        mozallowfullscreen="true" 
        webkitallowfullscreen="true">
    </iframe>

</body>
</html>
